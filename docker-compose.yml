services:

  postgres:
    image: postgres:16
    container_name: multiplayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiplayer_games
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multiplayer_games
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me}
      NEXT_PUBLIC_APP_ORIGIN: ${NEXT_PUBLIC_APP_ORIGIN:-http://localhost:3000}
      SOCKET_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  postgres_data:
